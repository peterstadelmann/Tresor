name: APK bauen

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.TRESOR_KEYSTORE_BASE64 }}
      TRESOR_KEYSTORE_PASSWORD: ${{ secrets.TRESOR_KEYSTORE_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Immer derselbe Signaturschlüssel → Updates lassen sich über die alte Version installieren
      - name: Signaturschlüssel bereitstellen
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/tresor.jks"
          echo "TRESOR_KEYSTORE_FILE=$RUNNER_TEMP/tresor.jks" >> "$GITHUB_ENV"

      - name: Tests und APK bauen
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleRelease --stacktrace

      - name: APK benennen
        run: cp app/build/outputs/apk/release/app-release.apk "Tresor-${{ github.ref_name == 'main' && format('build{0}', github.run_number) || github.ref_name }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Tresor-APK
          path: Tresor-*.apk

      - name: Release erstellen (bei Tag v…)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Tresor-*.apk
          generate_release_notes: true
